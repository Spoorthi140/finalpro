spring.application.name=smarturban-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:smarturbandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

smarturban.app.jwtSecret=smartUrbanSecretKeyForJwtTokenGenerationAndValidation32BytesLongMin!
smarturban.app.jwtExpirationMs=86400000
smarturban.upload.dir=uploads

admin.email=admin@smarturban.com
admin.password=Admin@123
admin.full-name=System Administrator
admin.phone=9876543210
