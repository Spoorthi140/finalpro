<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartUrban - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { width: 100%; max-width: 420px; border: none; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .logo-img { height: 90px; object-fit: contain; }
    </style>
</head>
<body>
<div class="card login-card p-4">
    <div class="text-center mb-4">
        <img th:src="@{/images/smarturban_logo.png}" alt="SmartUrban Logo" class="logo-img mb-2">
        <h4 class="fw-bold text-dark">SmartUrban Admin</h4>
        <p class="text-muted">Smart Urban Infrastructure Complaint Tracking System</p>
    </div>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <form th:action="@{/admin/login}" method="post">
        <div class="mb-3">
            <label class="form-label font-weight-bold">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="admin@smarturban.gov" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 font-weight-bold">Sign In to Admin Panel</button>
    </form>
</div>
</body>
</html>
