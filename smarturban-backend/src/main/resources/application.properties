spring.application.name=smarturban-backend
server.port=8080

# H2 Database settings (default for local dev and tests)
spring.datasource.url=jdbc:h2:mem:smarturbandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart configuration for image uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Properties
smarturban.app.jwtSecret=smartUrbanSecretKeyForJwtTokenGenerationAndValidation32BytesLongMin!
smarturban.app.jwtExpirationMs=86400000

# File Upload Directory
smarturban.upload.dir=uploads
