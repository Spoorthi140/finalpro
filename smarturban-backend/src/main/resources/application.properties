spring.application.name=smarturban-backend
server.port=8080

# MySQL Active Database Configuration (Database: smarturban_db)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smarturban_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ROOT@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart configuration for image uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Properties
smarturban.app.jwtSecret=smartUrbanSecretKeyForJwtTokenGenerationAndValidation32BytesLongMin!
smarturban.app.jwtExpirationMs=86400000

# File Upload Directory
smarturban.upload.dir=uploads

# Configurable Administrator Credentials
admin.email=${ADMIN_EMAIL:admin@smarturban.com}
admin.password=${ADMIN_PASSWORD:Admin@123}
admin.full-name=System Administrator
admin.phone=9876543210
