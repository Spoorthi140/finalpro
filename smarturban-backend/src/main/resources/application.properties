spring.application.name=smarturban-backend
server.port=8080

# Database Properties - H2 in-memory default for local dev/testing, configurable to MySQL via environment or application-mysql.properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smarturbandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Properties
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart configuration for image uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Properties
smarturban.app.jwtSecret=smartUrbanSecretKeyForJwtTokenGenerationAndValidation32BytesLongMin!
smarturban.app.jwtExpirationMs=86400000

# File Upload Directory
smarturban.upload.dir=uploads

# Configurable Administrator Credentials
admin.email=${ADMIN_EMAIL:admin@smarturban.com}
admin.password=${ADMIN_PASSWORD:Admin@123}
admin.full-name=System Administrator
admin.phone=9876543210
