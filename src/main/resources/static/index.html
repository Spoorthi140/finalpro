        // Enhanced Dashboard Component
        function Dashboard({ addToast }) {
            const [stats, setStats] = useState({
                totalMedications: 0,
                lowStock: 0,
                outOfStock: 0,
                totalValue: 0,
                totalSuppliers: 0,
                totalCategories: 0,
                monthlyRevenue: 0,
                inventoryHealth: 0
            });
            const [recentMedications, setRecentMedications] = useState([]);
            const [topSelling, setTopSelling] = useState([]);
            const [categoryStats, setCategoryStats] = useState([]);
            const [stockDistribution, setStockDistribution] = useState([]);
            const [loading, setLoading] = useState(true);
            const [expiringSoon, setExpiringSoon] = useState([]);
            const categoryChartRef = useRef(null);
            const stockChartRef = useRef(null);
            const salesChartRef = useRef(null);

            const loadDashboardData = useCallback(async () => {
                try {
                    setLoading(true);
                    const [medications, suppliers, categories, sales] = await Promise.all([
                        apiService.getMedications(),
                        apiService.getSuppliers(),
                        apiService.getCategories(),
                        apiService.getSales()
                    ]);

                    // Calculate statistics
                    const totalValue = medications.reduce((sum, med) => sum + (med.price * med.quantity), 0);
                    const lowStock = medications.filter(med => med.quantity <= med.reorderLevel && med.quantity > 0).length;
                    const outOfStock = medications.filter(med => med.quantity === 0).length;
                    const monthlyRevenue = sales.reduce((sum, sale) => sum + sale.revenue, 0);

                    // Calculate inventory health score (0-100)
                    const totalItems = medications.length;
                    const healthyItems = medications.filter(med => med.quantity > med.reorderLevel).length;
                    const inventoryHealth = totalItems > 0 ? Math.round((healthyItems / totalItems) * 100) : 100;

                    // Category statistics
                    const categoryData = categories.map(cat => ({
                        name: cat.name,
                        count: medications.filter(med => med.categoryId === cat.id).length,
                        value: medications
                            .filter(med => med.categoryId === cat.id)
                            .reduce((sum, med) => sum + (med.price * med.quantity), 0)
                    })).filter(cat => cat.count > 0);

                    // Stock distribution
                    const stockData = [
                        { status: 'Good Stock', count: medications.filter(med => med.quantity > med.reorderLevel).length },
                        { status: 'Low Stock', count: lowStock },
                        { status: 'Out of Stock', count: outOfStock }
                    ];

                    // Expiring soon (within 30 days)
                    const thirtyDaysFromNow = new Date();
                    thirtyDaysFromNow.setDate(thirtyDaysFromNow.getDate() + 30);
                    const expiring = medications.filter(med => {
                        if (!med.expiryDate) return false;
                        const expiry = new Date(med.expiryDate);
                        return expiry <= thirtyDaysFromNow && expiry > new Date();
                    }).slice(0, 5);

                    // Top selling medications
                    const topSellingMedications = [...medications]
                        .sort((a, b) => (b.sales || 0) - (a.sales || 0))
                        .slice(0, 5);

                    setStats({
                        totalMedications: medications.length,
                        lowStock: lowStock,
                        outOfStock: outOfStock,
                        totalValue: totalValue.toFixed(2),
                        totalSuppliers: suppliers.length,
                        totalCategories: categories.length,
                        monthlyRevenue: monthlyRevenue.toFixed(2),
                        inventoryHealth: inventoryHealth
                    });

                    setRecentMedications(medications.slice(-5).reverse());
                    setTopSelling(topSellingMedications);
                    setCategoryStats(categoryData);
                    setStockDistribution(stockData);
                    setExpiringSoon(expiring);

                    // Initialize charts after data is loaded
                    setTimeout(() => {
                        initializeCharts(categoryData, stockData, medications, sales);
                    }, 100);

                } catch (error) {
                    console.error('Error loading dashboard data:', error);
                    addToast('Error loading dashboard data: ' + error.message, 'error');
                } finally {
                    setLoading(false);
                }
            }, [addToast]);

            const initializeCharts = (categoryData, stockData, medications, sales) => {
                // Destroy existing charts if they exist
                if (categoryChartRef.current) {
                    categoryChartRef.current.destroy();
                }
                if (stockChartRef.current) {
                    stockChartRef.current.destroy();
                }
                if (salesChartRef.current) {
                    salesChartRef.current.destroy();
                }

                // Category Distribution Chart
                const categoryCtx = document.getElementById('categoryChart');
                if (categoryCtx && categoryData.length > 0) {
                    categoryChartRef.current = new Chart(categoryCtx, {
                        type: 'doughnut',
                        data: {
                            labels: categoryData.map(cat => cat.name),
                            datasets: [{
                                data: categoryData.map(cat => cat.count),
                                backgroundColor: [
                                    '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                                    '#9966FF', '#FF9F40', '#FF6384', '#C9CBCF'
                                ],
                                borderWidth: 2,
                                borderColor: '#fff'
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                },
                                title: {
                                    display: true,
                                    text: 'Medications by Category'
                                }
                            }
                        }
                    });
                }

                // Stock Status Chart
                const stockCtx = document.getElementById('stockChart');
                if (stockCtx && stockData.length > 0) {
                    stockChartRef.current = new Chart(stockCtx, {
                        type: 'pie',
                        data: {
                            labels: stockData.map(item => item.status),
                            datasets: [{
                                data: stockData.map(item => item.count),
                                backgroundColor: ['#28a745', '#ffc107', '#dc3545'],
                                borderWidth: 2,
                                borderColor: '#fff'
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                },
                                title: {
                                    display: true,
                                    text: 'Stock Status Distribution'
                                }
                            }
                        }
                    });
                }

                // Sales Trend Chart
                const salesCtx = document.getElementById('salesChart');
                if (salesCtx) {
                    // Group sales by date for the last 7 days
                    const last7Days = [...Array(7)].map((_, i) => {
                        const d = new Date();
                        d.setDate(d.getDate() - i);
                        return d.toISOString().split('T')[0];
                    }).reverse();

                    const salesByDate = last7Days.map(date => {
                        const daySales = sales.filter(s => s.date === date);
                        return daySales.reduce((sum, sale) => sum + sale.revenue, 0);
                    });

                    salesChartRef.current = new Chart(salesCtx, {
                        type: 'line',
                        data: {
                            labels: last7Days.map(date => new Date(date).toLocaleDateString()),
                            datasets: [{
                                label: 'Daily Revenue ($)',
                                data: salesByDate,
                                borderColor: '#4361ee',
                                backgroundColor: 'rgba(67, 97, 238, 0.1)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'top',
                                },
                                title: {
                                    display: true,
                                    text: 'Sales Trend (Last 7 Days)'
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                }
            };

            const getStockStatus = (quantity, reorderLevel) => {
                if (quantity === 0) return { text: 'Out of Stock', class: 'stock-low' };
                if (quantity <= reorderLevel) return { text: 'Low Stock', class: 'stock-warning' };
                return { text: 'In Stock', class: 'stock-good' };
            };

            const getHealthColor = (score) => {
                if (score >= 80) return '#22c55e';
                if (score >= 60) return '#f59e0b';
                return '#ef4444';
            };


            useEffect(() => {
                loadDashboardData();

                // Cleanup charts on unmount
                return () => {
                    if (categoryChartRef.current) {
                        categoryChartRef.current.destroy();
                    }
                    if (stockChartRef.current) {
                        stockChartRef.current.destroy();
                    }
                    if (salesChartRef.current) {
                        salesChartRef.current.destroy();
                    }
                };
            }, [loadDashboardData]);

            if (loading) {
                return (
                    <div className="container-fluid mt-4">
                        <div className="d-flex justify-content-center align-items-center" style={{height: '50vh'}}>
                            <div className="text-center">
                                <div className="spinner-border text-primary mb-3" style={{width: '3rem', height: '3rem'}}>
                                    <span className="visually-hidden">Loading...</span>
                                </div>
                                <h4>Loading Pharmacy Analytics...</h4>
                                <p className="text-muted">Please wait while we load your inventory data</p>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container-fluid mt-4 fade-in">
                    {/* Welcome Header */}
                    <div className="welcome-header text-center">
                        <h1 className="display-4 fw-bold mb-3">
                            <i className="bi bi-capsule-pill me-3"></i>
                            PharmaCare Dashboard
                        </h1>
                        <p className="lead mb-0">Comprehensive inventory management and analytics for your pharmacy</p>
                    </div>


                    {/* Inventory Health Score */}
                    <div className="inventory-health">
                        <div className="row align-items-center">
                            <div className="col-md-6">
                                <h3 className="fw-bold mb-3">Inventory Health</h3>
                                <div className="inventory-health-score" style={{color: getHealthColor(stats.inventoryHealth)}}>
                                    {stats.inventoryHealth}%
                                </div>
                                <p className="text-muted">Overall inventory health based on stock levels and expiry dates</p>
                            </div>
                            <div className="col-md-6">
                                <div className="health-indicator">
                                    <span className="health-label">Good Stock Items</span>
                                    <span className="health-value text-success">
                                        {stats.totalMedications - stats.lowStock - stats.outOfStock}
                                    </span>
                                </div>
                                <div className="health-indicator">
                                    <span className="health-label">Low Stock Items</span>
                                    <span className="health-value text-warning">{stats.lowStock}</span>
                                </div>
                                <div className="health-indicator">
                                    <span className="health-label">Out of Stock</span>
                                    <span className="health-value text-danger">{stats.outOfStock}</span>
                                </div>
                                <div className="health-indicator">
                                    <span className="health-label">Expiring Soon</span>
                                    <span className="health-value text-info">{expiringSoon.length}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Statistics Cards */}
                    <div className="dashboard-grid mb-4">
                        <div className="card stat-card dashboard-card">
                            <div className="card-body">
                                <div className="d-flex justify-content-between align-items-start">
                                    <div>
                                        <div className="stat-number">{stats.totalMedications}</div>
                                        <div className="stat-label">Total Medications</div>
                                    </div>
                                    <i className="bi bi-capsule display-6 opacity-75"></i>
                                </div>
                                <div className="mt-3">
                                    <small><i className="bi bi-arrow-up-circle-fill text-success me-1"></i> 12% from last month</small>
                                </div>
                            </div>
                        </div>
                        <div className="card low-stock-alert dashboard-card">
                            <div className="card-body">
                                <div className="d-flex justify-content-between align-items-start">
                                    <div>
                                        <div className="stat-number">{stats.lowStock}</div>
                                        <div className="stat-label">Low Stock Items</div>
                                    </div>
                                    <i className="bi bi-exclamation-triangle display-6 opacity-75"></i>
                                </div>
                                <div className="mt-3">
                                    <small>Needs immediate attention</small>
                                </div>
                            </div>
                        </div>
                        <div className="card out-of-stock-card dashboard-card">
                            <div className="card-body">
                                <div className="d-flex justify-content-between align-items-start">
                                    <div>
                                        <div className="stat-number">{stats.outOfStock}</div>
                                        <div className="stat-label">Out of Stock</div>
                                    </div>
                                    <i className="bi bi-x-circle display-6 opacity-75"></i>
                                </div>
                                <div className="mt-3">
                                    <small>Requires urgent restocking</small>
                                </div>
                            </div>
                        </div>
                        <div className="card revenue-card dashboard-card">
                            <div className="card-body">
                                <div className="d-flex justify-content-between align-items-start">
                                    <div>
                                        <div className="stat-number">${stats.monthlyRevenue}</div>
                                        <div className="stat-label">Monthly Revenue</div>
                                    </div>
                                    <i className="bi bi-currency-dollar display-6 opacity-75"></i>
                                </div>
                                <div className="mt-3">
                                    <small><i className="bi bi-arrow-up-circle-fill text-success me-1"></i> 8% from last month</small>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Charts Row */}
                    <div className="row mb-4">
                        <div className="col-lg-4">
                            <div className="chart-container">
                                <canvas id="categoryChart" height="250"></canvas>
                            </div>
                        </div>
                        <div className="col-lg-4">
                            <div className="chart-container">
                                <canvas id="stockChart" height="250"></canvas>
                            </div>
                        </div>
                        <div className="col-lg-4">
                            <div className="chart-container">
                                <canvas id="salesChart" height="250"></canvas>
                            </div>
                        </div>
                    </div>

                    {/* Bottom Row - Recent Activity & Top Selling */}
                    <div className="row">
                        <div className="col-lg-4">
                            <div className="card h-100">
                                <div className="card-header d-flex justify-content-between align-items-center">
                                    <h5 className="mb-0">
                                        <i className="bi bi-clock-history me-2"></i>
                                        Recent Medications
                                    </h5>
                                    <a href="#medications" className="btn btn-sm btn-outline-primary">
                                        View All
                                    </a>
                                </div>
                                <div className="card-body recent-activity">
                                    {recentMedications.length > 0 ? (
                                        recentMedications.map(med => {
                                            const stockStatus = getStockStatus(med.quantity, med.reorderLevel);
                                            return (
                                                <div key={med.id} className="activity-item">
                                                    <div className="d-flex justify-content-between align-items-start">
                                                        <div>
                                                            <h6 className="mb-1">{med.name}</h6>
                                                            <p className="mb-1 text-muted small">{med.genericName}</p>
                                                            <span className={`badge ${stockStatus.class === 'stock-good' ? 'bg-success' : stockStatus.class === 'stock-warning' ? 'bg-warning' : 'bg-danger'}`}>
                                                                {stockStatus.text}
                                                            </span>
                                                        </div>
                                                        <div className="text-end">
                                                            <div className="fw-bold">${med.price}</div>
                                                            <small className="text-muted">Qty: {med.quantity}</small>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    ) : (
                                        <p className="text-muted text-center">No recent medications</p>
                                    )}
                                </div>
                            </div>
                        </div>
                        <div className="col-lg-4">
                            <div className="card h-100">
                                <div className="card-header d-flex justify-content-between align-items-center">
                                    <h5 className="mb-0">
                                        <i className="bi bi-trophy me-2"></i>
                                        Top Selling
                                    </h5>
                                    <span className="badge bg-warning">This Month</span>
                                </div>
                                <div className="card-body">
                                    {topSelling.length > 0 ? (
                                        topSelling.map(med => (
                                            <div key={med.id} className="activity-item border-success">
                                                <div className="d-flex justify-content-between align-items-start">
                                                    <div>
                                                        <h6 className="mb-1">{med.name}</h6>
                                                        <p className="mb-1 text-muted small">{med.manufacturer}</p>
                                                        <span className="badge bg-success">
                                                            {med.sales || 0} sold
                                                        </span>
                                                    </div>
                                                    <div className="text-end">
                                                        <div className="fw-bold text-success">${med.price}</div>
                                                        <small className="text-muted">Stock: {med.quantity}</small>
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    ) : (
                                        <p className="text-muted text-center">No sales data available</p>
                                    )}
                                </div>
                            </div>
                        </div>
                        <div className="col-lg-4">
                            <div className="card h-100">
                                <div className="card-header d-flex justify-content-between align-items-center">
                                    <h5 className="mb-0">
                                        <i className="bi bi-calendar-x me-2"></i>
                                        Expiring Soon
                                    </h5>
                                    <span className="badge bg-warning">{expiringSoon.length} items</span>
                                </div>
                                <div className="card-body">
                                    {expiringSoon.length > 0 ? (
                                        expiringSoon.map(med => {
                                            const expiryDate = new Date(med.expiryDate);
                                            const daysUntilExpiry = Math.ceil((expiryDate - new Date()) / (1000 * 60 * 60 * 24));
                                            return (
                                                <div key={med.id} className="activity-item border-warning">
                                                    <div className="d-flex justify-content-between align-items-start">
                                                        <div>
                                                            <h6 className="mb-1">{med.name}</h6>
                                                            <p className="mb-1 text-muted small">{med.batchNumber}</p>
                                                            <span className="badge bg-warning">
                                                                Expires in {daysUntilExpiry} days
                                                            </span>
                                                        </div>
                                                        <div className="text-end">
                                                            <div className="fw-bold text-warning">
                                                                {expiryDate.toLocaleDateString()}
                                                            </div>
                                                            <small className="text-muted">Qty: {med.quantity}</small>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    ) : (
                                        <p className="text-muted text-center">No medications expiring soon</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }



        // Unified Inventory Component
        function Inventory({ addToast }) {
            const [activeTab, setActiveTab] = useState("suppliers");

            return (
                <div className="container-fluid mt-4 fade-in">
                    <h2 className="page-title">Inventory Control</h2>
                    <ul className="nav nav-pills mb-4">
                        <li className="nav-item">
                            <button
                                className={`nav-link ${activeTab === 'suppliers' ? 'active' : ''}`}
                                onClick={() => setActiveTab('suppliers')}
                            >
                                <i className="bi bi-truck me-1"></i>
                                Suppliers
                            </button>
                        </li>
                        <li className="nav-item ms-2">
                            <button
                                className={`nav-link ${activeTab === 'categories' ? 'active' : ''}`}
                                onClick={() => setActiveTab('categories')}
                            >
                                <i className="bi bi-tags me-1"></i>
                                Categories
                            </button>
                        </li>
                        <li className="nav-item ms-2">
                            <button
                                className={`nav-link ${activeTab === 'analytics' ? 'active' : ''}`}
                                onClick={() => setActiveTab('analytics')}
                            >
                                <i className="bi bi-graph-up me-1"></i>
                                Analytics
                            </button>
                        </li>
                    </ul>

                    {activeTab === 'suppliers' && <Suppliers addToast={addToast} />}
                    {activeTab === 'categories' && <Categories addToast={addToast} />}
                    {activeTab === 'analytics' && <Analytics addToast={addToast} />}
                </div>
            );
        }

        // Billing Component
        function Billing({ addToast }) {
            const [medications, setMedications] = useState([]);
            const [selectedMedId, setSelectedMedId] = useState("");
            const [quantity, setQuantity] = useState(1);
            const [sales, setSales] = useState([]);

            const loadData = async () => {
                const medsRes = await apiService.getMedications();
                setMedications(medsRes);
                const salesRes = await apiService.getSales();
                // Sort sales by date or ID descending
                setSales(salesRes.reverse().slice(0, 10));
            };

            useEffect(() => {
                loadData();
            }, []);

            const handleCreateBill = async (e) => {
                e.preventDefault();
                if (!selectedMedId) {
                    addToast("Please select a medication", "warning");
                    return;
                }
                const med = medications.find(m => m.id === parseInt(selectedMedId));
                if (!med) return;

                if (quantity <= 0) {
                    addToast("Quantity must be greater than 0", "warning");
                    return;
                }

                if (med.quantity < quantity) {
                    addToast(`Insufficient stock! Only ${med.quantity} items left in stock.`, "warning");
                    return;
                }

                try {
                    const today = new Date().toISOString().split('T')[0];
                    const saleData = {
                        date: today,
                        medicationId: med.id,
                        medicationName: med.name,
                        quantity: parseInt(quantity),
                        revenue: med.price * parseInt(quantity)
                    };

                    await apiService.createSale(saleData);
                    addToast(`Bill generated successfully for ${med.name}! Total: $${(med.price * quantity).toFixed(2)}`, "success");
                    setSelectedMedId("");
                    setQuantity(1);
                    loadData();
                } catch (err) {
                    addToast("Error generating bill: " + err.message, "error");
                }
            };

            return (
                <div className="container-fluid mt-4 fade-in">
                    <h2 className="page-title">Billing & Sales</h2>
                    <div className="row">
                        <div className="col-lg-5">
                            <div className="card shadow-sm border-0 rounded-4">
                                <div className="card-header bg-white py-3">
                                    <h5 className="fw-bold mb-0">Create New Bill</h5>
                                </div>
                                <div className="card-body p-4">
                                    <form onSubmit={handleCreateBill}>
                                        <div className="mb-3">
                                            <label className="form-label">Select Medication</label>
                                            <select
                                                className="form-select"
                                                value={selectedMedId}
                                                onChange={(e) => setSelectedMedId(e.target.value)}
                                            >
                                                <option value="">-- Select Medication --</option>
                                                {medications.map(med => (
                                                    <option key={med.id} value={med.id} disabled={med.quantity === 0}>
                                                        {med.name} (${Number(med.price).toFixed(2)}) - Stock: {med.quantity}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="mb-3">
                                            <label className="form-label">Quantity</label>
                                            <input
                                                type="number"
                                                className="form-control"
                                                min="1"
                                                value={quantity}
                                                onChange={(e) => setQuantity(e.target.value)}
                                            />
                                        </div>

                                        <button type="submit" className="btn btn-primary w-100">
                                            <i className="bi bi-receipt me-1"></i>
                                            Generate Bill
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div className="col-lg-7">
                            <div className="card shadow-sm border-0 rounded-4">
                                <div className="card-header bg-white py-3">
                                    <h5 className="fw-bold mb-0">Recent Bills / Sales Records</h5>
                                </div>
                                <div className="card-body p-0">
                                    <div className="table-responsive">
                                        <table className="table table-hover align-middle mb-0">
                                            <thead className="table-light">
                                                <tr>
                                                    <th>Date</th>
                                                    <th>Medication</th>
                                                    <th className="text-center">Quantity</th>
                                                    <th className="text-end">Total Amount</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {sales.map(sale => (
                                                    <tr key={sale.id}>
                                                        <td>{sale.date}</td>
                                                        <td className="fw-bold">{sale.medicationName}</td>
                                                        <td className="text-center">{sale.quantity}</td>
                                                        <td className="text-end fw-bold text-success">${Number(sale.revenue).toFixed(2)}</td>
                                                    </tr>
                                                ))}
                                                {sales.length === 0 && (
                                                    <tr>
                                                        <td colSpan="4" className="text-center text-muted py-4">No sales records found</td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [authChecked, setAuthLoaded] = useState(false);
            const [currentView, setCurrentView] = useState('dashboard');
            const { addToast, ToastContainer } = useToast();

            // Check session on mount
            useEffect(() => {
                const checkAuth = async () => {
                    try {
                        const res = await fetch('/api/auth/me');
                        if (res.ok) {
                            const data = await res.json();
                            if (data.success) {
                                setCurrentUser(data.data);
                            }
                        }
                    } catch (e) {
                        console.log('Session check failed');
                    } finally {
                        setAuthLoaded(true);
                    }
                };
                checkAuth();
            }, []);

            // Routing based on hash
            useEffect(() => {
                const handleHashChange = () => {
                    const hash = window.location.hash.replace('#', '') || 'dashboard';
                    setCurrentView(hash);
                };

                window.addEventListener('hashchange', handleHashChange);
                handleHashChange();

                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            const handleLogout = async () => {
                try {
                    await fetch('/api/auth/logout', { method: 'POST' });
                    setCurrentUser(null);
                    addToast('Logged out successfully', 'info');
                } catch (err) {
                    setCurrentUser(null);
                }
            };

            const handleFloatingAction = (action) => {
                switch(action) {
                    case 'add-medication':
                        setCurrentView('medications');
                        setTimeout(() => {
                            const addBtn = document.querySelector('.btn-primary');
                            if (addBtn) addBtn.click();
                        }, 500);
                        break;
                    case 'add-supplier':
                        setCurrentView('suppliers');
                        setTimeout(() => {
                            const addBtn = document.querySelector('.btn-primary');
                            if (addBtn) addBtn.click();
                        }, 500);
                        break;
                    case 'add-category':
                        setCurrentView('categories');
                        setTimeout(() => {
                            const addBtn = document.querySelector('.btn-primary');
                            if (addBtn) addBtn.click();
                        }, 500);
                        break;
                    case 'start-scan':
                        setCurrentView('barcode');
                        setTimeout(() => {
                            const startBtn = document.querySelector('.btn-primary');
                            if (startBtn) startBtn.click();
                        }, 500);
                        break;
                    case 'quick-sale':
                        addToast('Quick sale feature coming soon!', 'info');
                        break;
                    default:
                        addToast('Action triggered: ' + action, 'info');
                }
            };

            if (!authChecked) {
                return (
                    <div className="loading-screen">
                        <div className="spinner-border mb-3" style={{width: '3rem', height: '3rem'}}></div>
                        <h3>PharmaCare Inventory System</h3>
                        <p>Checking authentication state...</p>
                    </div>
                );
            }

            // Unauthenticated Flow
            if (!currentUser) {
                if (currentView === 'register') {
                    return (
                        <div>
                            <Register
                                onRegisterSuccess={(user) => { setCurrentUser(user); setCurrentView('dashboard'); }}
                                onNavigateToLogin={() => setCurrentView('login')}
                                addToast={addToast}
                            />
                            <ToastContainer />
                        </div>
                    );
                }

                return (
                    <div>
                        <Login
                            onLoginSuccess={(user) => { setCurrentUser(user); setCurrentView('dashboard'); }}
                            onNavigateToRegister={() => setCurrentView('register')}
                            addToast={addToast}
                        />
                        <ToastContainer />
                    </div>
                );
            }

            // Authenticated Flow (Protected Views)
            const renderView = () => {
                switch (currentView) {
                    case 'medications':
                        return <Medications addToast={addToast} />;
                    case 'inventory':
                        return <Inventory addToast={addToast} />;
                    case 'billing':
                        return <Billing addToast={addToast} />;
                    case 'scanner':
                        return <MedicineScanner addToast={addToast} />;
                    case 'expiry-alerts':
                        return <ExpiryAlerts addToast={addToast} />;
                    case 'sales-reports':
                        return <SalesReports addToast={addToast} />;
                    case 'dashboard':
                    default:
                        return <Dashboard addToast={addToast} />;
                }
            };

            return (
                <div>
                    <Navigation currentView={currentView} onViewChange={setCurrentView} currentUser={currentUser} onLogout={handleLogout} />
                    {renderView()}
                    <FloatingActionButton currentView={currentView} onAction={handleFloatingAction} />
                    <ToastContainer />
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<App />, document.getElementById('app'));
    </script>
</body>
</html>
