<!-- templates/admin/medications/form.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Medication Form - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar p-0">
                <div class="p-3">
                    <h4 class="text-center mb-4">
                        <i class="fas fa-ambulance me-2"></i>Admin Panel
                    </h4>

                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/dashboard}">
                                <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/first-aid-guides}">
                                <i class="fas fa-first-aid me-2"></i>First Aid Guides
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/symptoms}">
                                <i class="fas fa-stethoscope me-2"></i>Symptoms
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/admin/medications}">
                                <i class="fas fa-pills me-2"></i>Medications
                            </a>
                        </li>
                        <li class="nav-item mt-4">
                            <form th:action="@{/admin/logout}" method="post">
                                <button type="submit" class="nav-link border-0 bg-transparent text-start w-100">
                                    <i class="fas fa-sign-out-alt me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 main-content p-0">
                <nav class="navbar navbar-light bg-white border-bottom">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1" th:text="${pageTitle}">Medication Form</span>
                        <div>
                            <a th:href="@{/admin/medications}" class="btn btn-secondary btn-sm">
                                <i class="fas fa-arrow-left me-1"></i>Back to List
                            </a>
                        </div>
                    </div>
                </nav>

                <div class="p-4">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/admin/medications/save}" th:object="${medication}" method="post">
                                <input type="hidden" th:field="*{id}" />
                                <input type="hidden" th:field="*{createdAt}" />
                                <input type="hidden" th:field="*{updatedAt}" />

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="name" class="form-label">Brand Name *</label>
                                        <input type="text" class="form-control" id="name" th:field="*{name}"
                                               required placeholder="Enter brand name">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="genericName" class="form-label">Generic Name *</label>
                                        <input type="text" class="form-control" id="genericName" th:field="*{genericName}"
                                               required placeholder="Enter generic name">
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="drugClass" class="form-label">Drug Class *</label>
                                        <input type="text" class="form-control" id="drugClass" th:field="*{drugClass}"
                                               required placeholder="e.g., NSAID, Antibiotic, Antihistamine">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="dosageForms" class="form-label">Dosage Forms *</label>
                                        <input type="text" class="form-control" id="dosageForms" th:field="*{dosageForms}"
                                               required placeholder="e.g., Tablets, Capsules, Liquid">
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="prescriptionRequired" class="form-label">Prescription Required</label>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="prescriptionRequired"
                                                   th:field="*{prescriptionRequired}">
                                            <label class="form-check-label" for="prescriptionRequired">
                                                Requires prescription
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="commonUses" class="form-label">Common Uses *</label>
                                    <textarea class="form-control" id="commonUses" th:field="*{commonUses}"
                                              rows="2" required placeholder="What conditions does this medication treat?"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="usageInstructions" class="form-label">Usage Instructions *</label>
                                    <textarea class="form-control" id="usageInstructions" th:field="*{usageInstructions}"
                                              rows="3" required placeholder="How to take this medication"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="sideEffects" class="form-label">Side Effects</label>
                                    <textarea class="form-control" id="sideEffects" th:field="*{sideEffects}"
                                              rows="3" placeholder="Common side effects"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="precautions" class="form-label">Precautions</label>
                                    <textarea class="form-control" id="precautions" th:field="*{precautions}"
                                              rows="3" placeholder="Warnings and precautions"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="storageInstructions" class="form-label">Storage Instructions</label>
                                    <textarea class="form-control" id="storageInstructions" th:field="*{storageInstructions}"
                                              rows="2" placeholder="How to store this medication"></textarea>
                                </div>

                                <div class="d-flex justify-content-between">
                                    <a th:href="@{/admin/medications}" class="btn btn-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i>
                                        <span th:text="${medication.id != null} ? 'Update Medication' : 'Create Medication'">Save Medication</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
