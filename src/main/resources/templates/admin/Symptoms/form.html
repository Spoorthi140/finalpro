<!-- templates/admin/symptoms/form.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Symptom Form - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar p-0">
                <div class="p-3">
                    <h4 class="text-center mb-4">
                        <i class="fas fa-ambulance me-2"></i>Admin Panel
                    </h4>

                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/dashboard}">
                                <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/first-aid-guides}">
                                <i class="fas fa-first-aid me-2"></i>First Aid Guides
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/admin/symptoms}">
                                <i class="fas fa-stethoscope me-2"></i>Symptoms
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/medications}">
                                <i class="fas fa-pills me-2"></i>Medications
                            </a>
                        </li>
                        <li class="nav-item mt-4">
                            <form th:action="@{/admin/logout}" method="post">
                                <button type="submit" class="nav-link border-0 bg-transparent text-start w-100">
                                    <i class="fas fa-sign-out-alt me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 main-content p-0">
                <nav class="navbar navbar-light bg-white border-bottom">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1" th:text="${pageTitle}">Symptom Form</span>
                        <div>
                            <a th:href="@{/admin/symptoms}" class="btn btn-secondary btn-sm">
                                <i class="fas fa-arrow-left me-1"></i>Back to List
                            </a>
                        </div>
                    </div>
                </nav>

                <div class="p-4">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/admin/symptoms/save}" th:object="${symptom}" method="post">
                                <input type="hidden" th:field="*{id}" />
                                <input type="hidden" th:field="*{createdAt}" />
                                <input type="hidden" th:field="*{updatedAt}" />

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="name" class="form-label">Symptom Name *</label>
                                        <input type="text" class="form-control" id="name" th:field="*{name}"
                                               required placeholder="Enter symptom name">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="category" class="form-label">Category *</label>
                                        <input type="text" class="form-control" id="category" th:field="*{category}"
                                               required placeholder="e.g., Neurological, Cardiovascular, Respiratory">
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="severity" class="form-label">Severity *</label>
                                        <select class="form-select" id="severity" th:field="*{severity}" required>
                                            <option value="">Select Severity</option>
                                            <option value="Mild">Mild</option>
                                            <option value="Moderate">Moderate</option>
                                            <option value="High">High</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="description" class="form-label">Description *</label>
                                    <textarea class="form-control" id="description" th:field="*{description}"
                                              rows="3" required placeholder="Detailed description of the symptom"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="immediateActions" class="form-label">Immediate Actions *</label>
                                    <textarea class="form-control" id="immediateActions" th:field="*{immediateActions}"
                                              rows="3" required placeholder="What to do immediately when experiencing this symptom"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="warningSigns" class="form-label">Warning Signs</label>
                                    <textarea class="form-control" id="warningSigns" th:field="*{warningSigns}"
                                              rows="2" placeholder="Signs that indicate the condition is serious"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="whenToSeekHelp" class="form-label">When to Seek Help</label>
                                    <textarea class="form-control" id="whenToSeekHelp" th:field="*{whenToSeekHelp}"
                                              rows="2" placeholder="When should medical help be sought"></textarea>
                                </div>

                                <div class="d-flex justify-content-between">
                                    <a th:href="@{/admin/symptoms}" class="btn btn-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i>
                                        <span th:text="${symptom.id != null} ? 'Update Symptom' : 'Create Symptom'">Save Symptom</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
