<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Camera - SmartBiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        #camera-feed {
            width: 100%;
            max-width: 640px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--border-color);
        }
        .shimmer-overlay {
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 100% { left: 100%; } }
        #scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-color);
            top: 0;
            animation: scan 3s linear infinite;
            display: none;
        }
        @keyframes scan { 100% { top: 100%; } }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="nav-container"></div>

    <main class="main-content">
        <div class="container-fluid">
            <h1 class="fw-bold mb-4">AI Vision Inventory</h1>

            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="card p-4 h-100 shadow-sm text-center">
                        <div id="camera-feed" class="mx-auto mb-4">
                            <div class="shimmer-overlay"></div>
                            <div id="scan-line"></div>
                            <div class="h-100 d-flex align-items-center justify-content-center flex-column text-muted opacity-50">
                                <div class="display-1 mb-2">📸</div>
                                <p>Webcam Access Requested...</p>
                            </div>
                            <video id="video-element" class="w-100 h-100" style="object-fit: cover; display: none;" autoplay playsinline></video>
                        </div>
                        <div class="d-flex justify-content-center gap-3">
                            <button id="capture-btn" class="btn btn-primary btn-lg px-5 py-3 fw-bold">Analyze Frame</button>
                        </div>
                        <p class="text-muted mt-3 small">Causal AI engine will automatically count detected product units.</p>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card p-4 h-100 shadow-sm">
                        <h4 class="mb-4">Analysis Results</h4>

                        <div id="scan-result" class="hidden">
                            <div class="alert bg-success bg-opacity-10 border-success border-opacity-25 text-success mb-4 p-4 text-center">
                                <div class="small fw-bold text-uppercase mb-1">AI Confidence: 94.2%</div>
                                <div class="display-4 fw-bold"><span id="detected-count">0</span></div>
                                <div class="fw-bold">Units Detected</div>
                            </div>

                            <form id="save-inventory-form">
                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">PRODUCT LABEL</label>
                                    <input type="text" id="prod-name" class="form-control py-3" placeholder="e.g. Blue Widget A" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted small fw-bold">VERIFIED QUANTITY</label>
                                    <input type="number" id="prod-qty" class="form-control py-3" required>
                                </div>
                                <button type="submit" class="btn btn-success w-100 py-3 fw-bold">Save to Database</button>
                            </form>
                        </div>

                        <div id="no-scan" class="text-center py-5 opacity-50 h-100 d-flex flex-column align-items-center justify-content-center">
                            <div class="display-3 mb-3">📡</div>
                            <p class="text-muted">Align products in the camera view and click "Analyze Frame" to begin detection.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/main.js"></script>
    <script>
        const video = document.getElementById('video-element');
        const captureBtn = document.getElementById('capture-btn');
        const scanLine = document.getElementById('scan-line');
        const scanResult = document.getElementById('scan-result');
        const noScan = document.getElementById('no-scan');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.style.display = 'block';
                document.querySelector('.shimmer-overlay').style.display = 'none';
            } catch (e) {
                console.warn("Camera fallback active.");
            }
        }

        captureBtn.addEventListener('click', () => {
            scanLine.style.display = 'block';
            captureBtn.disabled = true;
            captureBtn.innerText = "Processing...";

            setTimeout(() => {
                const count = Math.floor(Math.random() * 45) + 5;
                document.getElementById('detected-count').innerText = count;
                document.getElementById('prod-qty').value = count;

                scanResult.classList.remove('hidden');
                noScan.classList.add('hidden');
                scanLine.style.display = 'none';
                captureBtn.disabled = false;
                captureBtn.innerText = "Analyze Frame";
            }, 1500);
        });

        document.getElementById('save-inventory-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/inventory', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    product_name: document.getElementById('prod-name').value,
                    quantity: parseInt(document.getElementById('prod-qty').value)
                })
            });
            if (res.ok) {
                alert("Inventory updated!");
                scanResult.classList.add('hidden');
                noScan.classList.remove('hidden');
            }
        });

        document.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
