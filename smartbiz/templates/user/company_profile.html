{% extends "base.html" %}

{% block title %}Company Profile - SmartBiz Enterprise{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <div class="glass-card">
            <h2 class="text-info mb-2"><i class="fas fa-building me-2"></i> Company Profile</h2>
            <p class="text-secondary">Manage your organization's core business information.</p>
        </div>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="glass-card">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-12 mb-3">
                        <label class="form-label text-info">Company Name</label>
                        <input type="text" name="name" class="form-control bg-dark text-white border-secondary" value="{{ company.name if company else '' }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-info">Industry</label>
                        <select name="industry" class="form-select bg-dark text-white border-secondary">
                            <option value="Retail" {{ 'selected' if company and company.industry == 'Retail' }}>Retail</option>
                            <option value="Manufacturing" {{ 'selected' if company and company.industry == 'Manufacturing' }}>Manufacturing</option>
                            <option value="Technology" {{ 'selected' if company and company.industry == 'Technology' }}>Technology</option>
                            <option value="Logistics" {{ 'selected' if company and company.industry == 'Logistics' }}>Logistics</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-info">Business Type</label>
                        <input type="text" name="business_type" class="form-control bg-dark text-white border-secondary" placeholder="e.g. B2B, eCommerce" value="{{ company.business_type if company else '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-info">Contact Number</label>
                        <input type="text" name="contact_number" class="form-control bg-dark text-white border-secondary" value="{{ company.contact_number if company else '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-info">Branch Count</label>
                        <input type="number" name="branch_count" class="form-control bg-dark text-white border-secondary" value="{{ company.branch_count if company else 1 }}">
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label text-info">Headquarters Address</label>
                        <textarea name="address" class="form-control bg-dark text-white border-secondary" rows="3">{{ company.address if company else '' }}</textarea>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-info w-100 py-2 fw-bold">Update Profile</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
