{% extends "base.html" %}

{% block title %}Company Profile - SmartBiz Enterprise{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="glass-card">
            <h2 class="text-info mb-4"><i class="fas fa-building me-2"></i> Company Profile</h2>
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Company Name</label>
                        <input type="text" name="name" class="form-control bg-dark text-white border-secondary" value="{{ company.name if company else '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Industry</label>
                        <input type="text" name="industry" class="form-control bg-dark text-white border-secondary" value="{{ company.industry if company else '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Business Type</label>
                        <select name="business_type" class="form-select bg-dark text-white border-secondary">
                            <option value="Retail" {{ 'selected' if company and company.business_type == 'Retail' else '' }}>Retail</option>
                            <option value="Manufacturing" {{ 'selected' if company and company.business_type == 'Manufacturing' else '' }}>Manufacturing</option>
                            <option value="Service" {{ 'selected' if company and company.business_type == 'Service' else '' }}>Service</option>
                            <option value="E-commerce" {{ 'selected' if company and company.business_type == 'E-commerce' else '' }}>E-commerce</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Branch Count</label>
                        <input type="number" name="branch_count" class="form-control bg-dark text-white border-secondary" value="{{ company.branch_count if company else 1 }}">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control bg-dark text-white border-secondary" rows="3">{{ company.address if company else '' }}</textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Contact Number</label>
                        <input type="text" name="contact_number" class="form-control bg-dark text-white border-secondary" value="{{ company.contact_number if company else '' }}">
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-neon w-100">Save Profile</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
