{% extends "base.html" %}

{% block title %}Smart Inventory - SmartBiz{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="glass-card">
            <h4 class="mb-4 text-info"><i class="fas fa-video me-2"></i> Real-time Scanner</h4>
            <div id="camera-container" class="position-relative bg-dark rounded overflow-hidden" style="height: 350px;">
                <video id="video" width="100%" height="100%" autoplay></video>
                <canvas id="canvas" style="display:none;"></canvas>
            </div>
            <div class="mt-3 text-center">
                <button id="capture-btn" class="btn btn-neon btn-lg">
                    <i class="fas fa-camera me-2"></i> Capture & Count
                </button>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="glass-card">
            <h4 class="mb-4 text-info"><i class="fas fa-microchip me-2"></i> Detection Result</h4>
            <div id="result-container" class="bg-dark rounded overflow-hidden d-flex align-items-center justify-content-center" style="height: 350px;">
                <img id="processed-img" class="img-fluid" src="" style="display:none;">
                <p id="placeholder-text" class="text-light-50">Capture an image to see detection results</p>
            </div>
            <div class="mt-4">
                <h5>Product Count: <span id="count-value" class="text-info">--</span></h5>
                <div id="update-form" style="display:none;">
                    <hr class="bg-light">
                    <h6>Update Inventory Database</h6>
                    <div class="input-group">
                        <select id="product-select" class="form-select bg-dark text-white border-secondary">
                            {% for product in products %}
                            <option value="{{ product.id }}">{{ product.product_name }}</option>
                            {% endfor %}
                        </select>
                        <button id="update-btn" class="btn btn-info">Update Stock</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    #video { transform: scaleX(-1); }
</style>
{% endblock %}

{% block extra_js %}
<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('capture-btn');
    const processedImg = document.getElementById('processed-img');
    const countValue = document.getElementById('count-value');
    const updateForm = document.getElementById('update-form');
    const productSelect = document.getElementById('product-select');
    const updateBtn = document.getElementById('update-btn');

    // Access Webcam
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { console.error("Error accessing webcam:", err); });

    captureBtn.addEventListener('click', () => {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = canvas.toDataURL('image/jpeg');

        // Send to backend
        fetch('/process_inventory', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: imageData })
        })
        .then(res => res.json())
        .then(data => {
            processedImg.src = data.processed_image;
            processedImg.style.display = 'block';
            document.getElementById('placeholder-text').style.display = 'none';
            countValue.innerText = data.count;
            updateForm.style.display = 'block';
        })
        .catch(err => console.error(err));
    });

    updateBtn.addEventListener('click', () => {
        const productId = productSelect.value;
        const quantity = countValue.innerText;

        fetch('/update_inventory', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product_id: productId, quantity: quantity })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                alert('Stock updated successfully!');
                location.reload();
            }
        });
    });
</script>
{% endblock %}
