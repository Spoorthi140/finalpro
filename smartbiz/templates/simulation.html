<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation - SmartBiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="nav-container"></div>
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="container-fluid">
            <h1 class="fw-bold mb-4">Business Outcome Simulation</h1>

            <div class="row g-4">
                <div class="col-md-5">
                    <div class="card p-4">
                        <h4 class="mb-4">Input Parameters</h4>
                        <form id="simulation-form">
                            <div class="mb-3">
                                <label class="form-label">Unit Price (₹)</label>
                                <input type="number" step="0.01" id="sim-price" class="form-control" value="150" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Marketing Budget (₹)</label>
                                <input type="number" id="sim-marketing" class="form-control" value="2000" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Starting Stock (Units)</label>
                                <input type="number" id="sim-stock" class="form-control" value="100" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Run Prediction</button>
                        </form>
                    </div>
                </div>
                <div class="col-md-7">
                    <div id="sim-results" class="card p-4 h-100 bg-primary text-theme hidden">
                        <h4 class="mb-4 text-theme">Predicted Outcomes</h4>
                        <div class="row text-center">
                            <div class="col-md-4">
                                <p class="mb-1 opacity-75">Predicted Sales</p>
                                <h2 class="fw-bold" id="res-sales">0</h2>
                            </div>
                            <div class="col-md-4">
                                <p class="mb-1 opacity-75">Predicted Profit</p>
                                <h2 class="fw-bold" id="res-profit">₹0</h2>
                            </div>
                            <div class="col-md-4">
                                <p class="mb-1 opacity-75">Days till Stock-out</p>
                                <h2 class="fw-bold" id="res-stockout">0</h2>
                            </div>
                        </div>
                        <div class="mt-5 text-center">
                            <a href="/recommendation" class="btn btn-light">View Strategy Recommendation</a>
                        </div>
                    </div>
                    <div id="sim-placeholder" class="card p-4 h-100 border-dashed d-flex align-items-center justify-content-center">
                        <p class="text-muted">Enter parameters and run simulation to see results.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('simulation-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/simulation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    price: document.getElementById('sim-price').value,
                    marketing: document.getElementById('sim-marketing').value,
                    stock: document.getElementById('sim-stock').value
                })
            });
            if (res.ok) {
                const data = await res.json();
                document.getElementById('res-sales').innerText = data.predicted_sales;
                document.getElementById('res-profit').innerText = '₹' + data.predicted_profit.toFixed(2);
                document.getElementById('res-stockout').innerText = data.stockout_days;

                document.getElementById('sim-results').classList.remove('hidden');
                document.getElementById('sim-placeholder').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
