<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartBiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card p-5 shadow-lg auth-card border-0" style="width: 100%; max-width: 450px; border-radius: 24px;">
            <div class="text-center mb-5">
                <h1 class="fw-bold text-theme mb-2">SmartBiz</h1>
                <p class="text-muted small">Enter your credentials to access your AI dashboard</p>
            </div>

            <form id="login-form">
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">EMAIL ADDRESS</label>
                    <input type="email" class="form-control py-3" id="email" placeholder="name@company.com" required>
                </div>
                <div class="mb-5">
                    <div class="d-flex justify-content-between">
                        <label class="form-label text-muted small fw-bold">PASSWORD</label>
                    </div>
                    <input type="password" class="form-control py-3" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow">Sign In</button>
            </form>

            <div class="text-center mt-5">
                <p class="text-muted small mb-0">New to the platform? <a href="/register" class="text-primary text-decoration-none fw-bold">Create an Account</a></p>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            Auth.login(
                document.getElementById('email').value,
                document.getElementById('password').value
            );
        });
    </script>
</body>
</html>
