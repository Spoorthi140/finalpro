<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartBiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card p-5 shadow-lg auth-card border-0" style="width: 100%; max-width: 450px; border-radius: 24px;">
            <div class="text-center mb-5">
                <h1 class="fw-bold text-theme mb-2">Join SmartBiz</h1>
                <p class="text-muted small">Begin optimizing your strategy with Causal AI</p>
            </div>

            <form id="register-form">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">FULL NAME</label>
                    <input type="text" class="form-control py-3" id="name" placeholder="John Doe" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">WORK EMAIL</label>
                    <input type="email" class="form-control py-3" id="email" placeholder="john@company.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">SECURE PASSWORD</label>
                    <input type="password" class="form-control py-3" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow">Create Account</button>
            </form>

            <div class="text-center mt-5">
                <p class="text-muted small mb-0">Already using SmartBiz? <a href="/login" class="text-primary text-decoration-none fw-bold">Log In</a></p>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });

            if (res.ok) {
                window.location.href = '/login';
            } else {
                const data = await res.json();
                alert(data.error);
            }
        });
    </script>
</body>
</html>
