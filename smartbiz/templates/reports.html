<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Reports - SmartBiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="nav-container"></div>

    <main class="main-content">
        <div class="container-fluid">
            <h1 class="fw-bold mb-4">Business Performance Reports</h1>

            <div class="row g-4 mb-4">
                <div class="col-md-12">
                    <div class="card p-4 text-center shadow-sm">
                        <h4 class="mb-4">Inventory Distribution</h4>
                        <div class="bg-dark bg-opacity-50 p-3 rounded">
                            <img id="inventory-chart" class="img-fluid rounded mx-auto" alt="Inventory Chart" style="max-height: 400px; filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.2));">
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="card p-4 h-100 shadow-sm">
                        <h4 class="mb-4">Real-time Inventory Log</h4>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Product</th>
                                        <th class="text-center">Quantity</th>
                                        <th>Stock Status</th>
                                    </tr>
                                </thead>
                                <tbody id="inv-report-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card p-4 h-100 shadow-sm">
                        <h4 class="mb-4">Simulation History</h4>
                        <div id="sim-history" class="list-group list-group-flush bg-transparent">
                            <div class="text-center py-5 text-muted">
                                <p>Historical performance data will appear here after your first simulation.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/main.js"></script>
    <script>
        async function loadReports() {
            // Inventory Report
            const invRes = await fetch('/api/inventory');
            if (invRes.ok) {
                const data = await invRes.json();
                if (data.chart) {
                    document.getElementById('inventory-chart').src = 'data:image/png;base64,' + data.chart;
                }
                document.getElementById('inv-report-body').innerHTML = data.items.length ? data.items.map(i => `
                    <tr>
                        <td class="fw-bold text-theme">${i.product_name}</td>
                        <td class="text-center">${i.quantity}</td>
                        <td>
                            <span class="badge ${i.quantity < 20 ? 'bg-danger bg-opacity-10 text-danger' : 'bg-success bg-opacity-10 text-success'}">
                                ${i.quantity < 20 ? 'Low Stock' : 'Optimal'}
                            </span>
                        </td>
                    </tr>
                `).join('') : '<tr><td colspan="3" class="text-center text-muted">No inventory data found. Use AI Camera to add products.</td></tr>';
            }

            // Recommendation/Simulation History
            const recRes = await fetch('/api/recommendation');
            if (recRes.ok) {
                const data = await recRes.json();
                document.getElementById('sim-history').innerHTML = `
                    <div class="p-4 rounded bg-primary bg-opacity-10 border border-primary border-opacity-25">
                        <div class="d-flex justify-content-between mb-3">
                            <h6 class="fw-bold m-0 text-primary">Last Forecast</h6>
                            <small class="text-muted">Most Recent</small>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <div class="p-2 bg-dark rounded text-center">
                                    <small class="d-block text-muted">SALES</small>
                                    <span class="fw-bold">${data.prediction.sales.toFixed(1)}</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="p-2 bg-dark rounded text-center">
                                    <small class="d-block text-muted">PROFIT</small>
                                    <span class="fw-bold text-success">₹${data.prediction.profit.toLocaleString()}</span>
                                </div>
                            </div>
                        </div>
                        <div class="alert border-0 small m-0 text-muted">
                            Stock-out predicted in <strong>${data.prediction.stockout_days} days</strong> based on current demand.
                        </div>
                    </div>
                `;
            }
        }
        document.addEventListener('DOMContentLoaded', loadReports);
    </script>
</body>
</html>
