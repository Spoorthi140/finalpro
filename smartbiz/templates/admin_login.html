<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - SmartBiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card p-5 shadow-lg auth-card border-0" style="width: 100%; max-width: 450px; border-radius: 24px; border-top: 4px solid var(--danger-color) !important;">
            <div class="text-center mb-5">
                <h2 class="fw-bold text-theme mb-2">Admin Portal</h2>
                <p class="text-muted small">Secure administrator gateway</p>
            </div>

            <form id="admin-login-form">
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">ADMIN IDENTIFIER</label>
                    <input type="email" class="form-control py-3" id="email" required>
                </div>
                <div class="mb-5">
                    <label class="form-label text-muted small fw-bold">SECURITY KEY</label>
                    <input type="password" class="form-control py-3" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow">Authorize Session</button>
            </form>
            <div class="text-center mt-5">
                <a href="/" class="text-muted small text-decoration-none">← Return to System Home</a>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            Auth.login(
                document.getElementById('email').value,
                document.getElementById('password').value
            );
        });
    </script>
</body>
</html>
