{% extends "admin/base_admin.html" %}

{% block admin_content %}
<h2 class="text-theme mb-4">Strategic Recommendations</h2>
<div class="glass-card p-4">
    <div class="table-responsive">
        <table class="table table-dark table-hover">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Message</th>
                    <th>Priority</th>
                </tr>
            </thead>
            <tbody>
                {% for r in recommendations %}
                <tr>
                    <td>{{ r.created_at.strftime('%Y-%m-%d') }}</td>
                    <td>{{ r.category }}</td>
                    <td>{{ r.message }}</td>
                    <td><span class="badge bg-{{ 'danger' if r.priority == 'High' else 'info' }}">{{ r.priority }}</span></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
