<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartBiz Enterprise Admin - Control Center{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --admin-bg: #0a0a0a;
            --admin-accent: #e94560;
            --admin-secondary: #1a1a2e;
            --admin-glass: rgba(255, 255, 255, 0.05);
            --admin-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--admin-bg);
            color: #e0e0e0;
            min-height: 100vh;
        }

        #admin-sidebar {
            min-width: 280px;
            max-width: 280px;
            background: var(--admin-secondary);
            border-right: 1px solid var(--admin-border);
            height: 100vh;
            position: fixed;
            z-index: 1000;
        }

        .admin-logo {
            font-family: 'Orbitron', sans-serif;
            color: var(--admin-accent);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid var(--admin-border);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #admin-sidebar ul.nav {
            padding: 20px 0;
        }

        #admin-sidebar .nav-link {
            color: #888;
            padding: 12px 25px;
            transition: 0.3s;
        }

        #admin-sidebar .nav-link:hover, #admin-sidebar .nav-link.active {
            color: var(--admin-accent);
            background: var(--admin-glass);
            border-left: 4px solid var(--admin-accent);
        }

        #admin-content {
            width: calc(100% - 280px);
            margin-left: 280px;
            padding: 40px;
        }

        .admin-card {
            background: var(--admin-glass);
            border: 1px solid var(--admin-border);
            border-radius: 10px;
            padding: 25px;
        }

        .btn-admin {
            background: var(--admin-accent);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-admin:hover {
            background: #ff5e78;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
            color: white;
        }

        .table-admin {
            background: transparent;
            color: #ccc;
        }

        .table-admin thead th {
            color: var(--admin-accent);
            border-bottom: 1px solid var(--admin-border);
        }
    </style>
</head>
<body>
    <nav id="admin-sidebar">
        <div class="admin-logo">
            <h4><i class="fas fa-shield-alt me-2"></i> Enterprise Admin</h4>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="{{ url_for('admin.dashboard') }}">
                    <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('user.home') }}">
                    <i class="fas fa-external-link-alt me-2"></i> View Site
                </a>
            </li>
            <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="{{ url_for('user.logout') }}">
                    <i class="fas fa-sign-out-alt me-2"></i> Logout
                </a>
            </li>
        </ul>
    </nav>

    <div id="admin-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'danger' else 'danger' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
