<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBiz Enterprise - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .btn-neon {
            background: transparent;
            border: 1px solid #e94560;
            color: #e94560;
            transition: 0.3s;
        }
        .btn-neon:hover {
            background: #e94560;
            color: white;
            box-shadow: 0 0 15px #e94560;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: none;
            border: 1px solid #e94560;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h2 class="text-center mb-4 text-uppercase fw-bold" style="letter-spacing: 2px; color: #e94560;">Admin Portal</h2>
        <p class="text-center small text-light-50 mb-4">Secure access for authorized personnel only</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label small">Admin Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label small">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-neon w-100 py-2 fw-bold">AUTHENTICATE</button>
        </form>
        <div class="mt-4 text-center">
            <a href="{{ url_for('user.home') }}" class="text-decoration-none text-light-50 small"><i class="fas fa-arrow-left"></i> Back to Site</a>
        </div>
    </div>
</body>
</html>
