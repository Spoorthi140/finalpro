{% extends "admin/base_admin.html" %}

{% block admin_content %}
<h2 class="text-white mb-4">System Settings</h2>
<div class="glass-card p-4">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label text-secondary">Platform Name</label>
            <input type="text" class="form-control bg-dark text-white border-secondary" value="SmartBiz Enterprise" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label text-secondary">Maintenance Mode</label>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox">
                <label class="form-check-label text-white">Off</label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
