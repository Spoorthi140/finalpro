{% extends "admin/base_admin.html" %}

{% block admin_content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card p-4">
            <h2 class="text-theme mb-4">Edit User: {{ user.full_name }}</h2>
            <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label text-secondary">Full Name</label>
                    <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">Email Address</label>
                    <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">Phone Number</label>
                    <input type="text" name="phone" class="form-control" value="{{ user.phone if user.phone else '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">Role</label>
                    <select name="role" class="form-select">
                        <option value="User" {{ 'selected' if user.role == 'User' }}>User</option>
                        <option value="Admin" {{ 'selected' if user.role == 'Admin' }}>Admin</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">Status</label>
                    <select name="status" class="form-select">
                        <option value="Active" {{ 'selected' if user.status == 'Active' }}>Active</option>
                        <option value="Inactive" {{ 'selected' if user.status == 'Inactive' }}>Inactive</option>
                    </select>
                </div>
                <div class="mt-4 d-flex flex-column gap-2">
                    <button type="submit" class="btn btn-warning text-dark fw-bold shadow-sm w-100" data-bs-toggle="tooltip" title="Save updated user credentials"><i class="fas fa-sync"></i> 🔄 Update</button>
                    <a href="{{ url_for('admin.users') }}" class="btn btn-secondary text-white fw-semibold shadow-sm w-100" data-bs-toggle="tooltip" title="Go back without saving"><i class="fas fa-times"></i> ✖ Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
